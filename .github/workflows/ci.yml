name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ROBOT_VERSION: v1.9.8
  ROBOT_SHA256: 6f518b0293d8146d8a5a168c53607a952effb66bcaf3c6539996d7ec5c5f05f8

jobs:
  checks:
    name: Pins, contract, canonical Turtle, registry, handling, label map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      # SHACL (R8) and CQ suite (R10) run here once shapes/ and cq/ have content (tasks 6.x, 8.3).

  robot:
    name: ROBOT reason (HermiT) and QC report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install ROBOT (pinned, hash-checked)
        run: |
          curl -sSfL -o robot.jar "https://github.com/ontodev/robot/releases/download/${ROBOT_VERSION}/robot.jar"
          echo "${ROBOT_SHA256}  robot.jar" | sha256sum --check
      - name: Reason over the full import closure (offline, via catalog)
        run: |
          mkdir -p reports
          java -Xmx4g -jar robot.jar --catalog ontology/catalog-v001.xml \
            merge --input ontology/aoc-dfo.ttl \
            reason --reasoner hermit --equivalent-classes-allowed all \
              --dump-unsatisfiable reports/unsatisfiable.ofn \
              --output reports/aoc-dfo-merged-reasoned.owl
      - name: QC report on AOC-DFO terms
        run: |
          java -Xmx4g -jar robot.jar --catalog ontology/catalog-v001.xml \
            report --input ontology/aoc-dfo.ttl --base-iri https://w3id.org/aoc-dfo/ \
            --fail-on ERROR --output reports/robot-report.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: reports/
